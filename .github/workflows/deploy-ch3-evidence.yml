name: Install Chapter 3 evidence images
on:
  push:
    branches: [main]
    paths:
      - gguhansung_ch3_evidence_webp_3.zip
permissions:
  contents: write
jobs:
  install-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and install the three evidence assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('gguhansung_ch3_evidence_webp_3.zip')
          paths=[
            'assets/evidence/group-2250.webp',
            'assets/evidence/nvr-wallclock-223413.webp',
            'assets/evidence/smartwatch-last-activity-2241.webp'
          ]
          with ZipFile(archive) as z:
            entries=set(z.namelist())
            if not set(paths).issubset(entries):
              raise SystemExit('Missing evidence image: '+str(set(paths)-entries))
            for path in paths:
              content=z.read(path)
              if content[:4]!=b'RIFF' or content[8:12]!=b'WEBP':
                raise SystemExit('Not a WebP: '+path)
              dst=Path(path)
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(content)
          archive.unlink()
          PY
      - name: Commit evidence files and remove ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/evidence/group-2250.webp assets/evidence/nvr-wallclock-223413.webp assets/evidence/smartwatch-last-activity-2241.webp
          git add -u gguhansung_ch3_evidence_webp_3.zip
          git commit -m "assets: install chapter 3 evidence photos"
          git push origin HEAD:main
